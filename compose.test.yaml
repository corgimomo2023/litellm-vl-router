services:
  mock-provider:
    image: python:3.12-alpine
    command: ["python", "/tests/mock_provider.py"]
    volumes:
      - ./tests:/tests:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 20
    networks: [backend]

  litellm:
    environment:
      OPENCODE_GO_API_KEY: test-opencode-go-key
      OPENCODE_GO_API_BASE: http://mock-provider:8080/opencode-go/v1
      OPENCODE_GO_MODEL: openai/deepseek-v4-flash
      GPT_LUNA_API_KEY: test-gpt-luna-key
      GPT_LUNA_API_BASE: http://mock-provider:8080/gpt-luna/v1
      GPT_LUNA_MODEL: openai/gpt-luna-vision
    depends_on:
      mock-provider:
        condition: service_healthy
