services:
  mock-provider:
    image: python:3.12-alpine
    command: ["python", "/tests/mock_provider.py"]
    volumes:
      - ./tests:/tests:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 20
    networks: [backend]

  litellm:
    environment:
      DEEPSEEK_API_KEY: test-deepseek-key
      DEEPSEEK_API_BASE: http://mock-provider:8080/deepseek/v1
      DEEPSEEK_FLASH_MODEL: openai/deepseek-v4-flash
      DEEPSEEK_PRO_MODEL: openai/deepseek-v4-pro
      QWEN_API_KEY: test-qwen-key
      QWEN_API_BASE: http://mock-provider:8080/qwen/v1
      QWEN_VISION_MODEL: openai/qwen3.5-flash
    depends_on:
      mock-provider:
        condition: service_healthy
