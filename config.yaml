model_list:
  # The only public OpenAI-compatible model ID. Text/code uses OpenCode Go.
  - model_name: DeepSeek-v4-vl
    litellm_params:
      model: os.environ/OPENCODE_GO_MODEL
      api_base: os.environ/OPENCODE_GO_API_BASE
      api_key: os.environ/OPENCODE_GO_API_KEY
      timeout: 180
    model_info:
      mode: chat
      description: "DeepSeek V4 Flash text/code via OpenCode Go; current-turn images auto-route to GPT Luna"

  # Internal target used by app.custom_handler.vl_router; do not expose to clients.
  - model_name: _internal-gpt-luna-vision
    litellm_params:
      model: os.environ/GPT_LUNA_MODEL
      api_base: os.environ/GPT_LUNA_API_BASE
      api_key: os.environ/GPT_LUNA_API_KEY
      timeout: 180
    model_info:
      mode: chat
      description: "Internal GPT Luna vision target"

litellm_settings:
  callbacks: app.custom_handler.vl_router
  drop_params: true
  request_timeout: 180
  num_retries: 2
  json_logs: true
  # WARNING: payload logging can contain source code, images, PII, and secrets.
  # Keep this enabled only when operators accept that spend logs retain content.
  turn_off_message_logging: false
  redact_user_api_key_info: true
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    password: os.environ/REDIS_PASSWORD
    namespace: litellm-vl-router
    mode: default_off
    ttl: 600
  enable_redis_auth_cache: true

router_settings:
  routing_strategy: simple-shuffle
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  redis_password: os.environ/REDIS_PASSWORD
  enable_pre_call_checks: true
  allowed_fails: 3
  cooldown_time: 30
  retry_policy:
    AuthenticationErrorRetries: 0
    TimeoutErrorRetries: 2
    RateLimitErrorRetries: 2
    InternalServerErrorRetries: 2

# Master/salt keys and database URL are supplied only through environment variables.
# LITELLM_SALT_KEY must stay stable after the first database initialization.
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  database_connection_pool_limit: 10
  database_connection_timeout: 60
  # WARNING: stores request/response content in spend logs; protect DB backups/access.
  store_prompts_in_spend_logs: true
  disable_spend_logs: false
  disable_master_key_return: true
  background_health_checks: true
  health_check_interval: 300
