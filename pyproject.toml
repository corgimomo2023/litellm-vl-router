[project]
name = "litellm-vl-router"
version = "0.1.0"
description = "LiteLLM gateway routing DeepSeek-v4-vl text through OpenCode Go and current-turn images through GPT Luna"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8.0,<9.0",
  "pyyaml>=6.0,<7.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
